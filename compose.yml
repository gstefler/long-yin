services:
    tts-api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: chinese-tts-api
        ports:
            - "3003:3000"
        volumes:
            - ./audio-cache:/app/audio-cache
        environment:
            - PORT=3000
            - NODE_ENV=production
            - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
            - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-}
            - AZURE_SPEECH_RPM=${AZURE_SPEECH_RPM:-20}
        restart: unless-stopped
